services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      WINDLINE_DEMO_MODE: ${WINDLINE_DEMO_MODE:-false}
      WINDLINE_ALLOW_DEMO_FALLBACK: ${WINDLINE_ALLOW_DEMO_FALLBACK:-true}
      WINDLINE_CACHE_TTL_SECONDS: ${WINDLINE_CACHE_TTL_SECONDS:-900}
      WINDLINE_CORS_ORIGINS: ${WINDLINE_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
